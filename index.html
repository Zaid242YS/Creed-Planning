<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shajarah: Verified Plan Tree</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f3f5fb; --surface:#ffffff; --surface-2:#f7f8fd; --ink:#141833; --muted:#5d6385; --line:#e2e5f1;
  --creed:#0f9d76; --craft:#7c4dff; --commerce:#e39b06; --care:#e8437f; --contrib:#0a95d6;
  --gold:#d99a00; --indigo:#4338ca; --good:#12a150; --warn:#e08a00; --bad:#e0413a;
  --sacred-a:#0f766e; --sacred-b:#14b8a6;
  --effort:#4f46e5; --self:#e39b06; --verified:#12a150;
  --chip:#eef0fa; --shadow:0 1px 2px rgba(20,24,51,.06),0 8px 24px rgba(20,24,51,.06);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif; --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-ar:"Amiri","Geeza Pro","Traditional Arabic",serif;
  --r:14px; color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1022; --surface:#161a33; --surface-2:#1b2040; --ink:#eef0ff; --muted:#a2a8cc; --line:#2a3058;
  --creed:#2dd4a7; --craft:#a78bfa; --commerce:#fbbf24; --care:#f472b6; --contrib:#38bdf8;
  --gold:#fbbf24; --indigo:#818cf8; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --effort:#818cf8; --self:#fbbf24; --verified:#34d399;
  --chip:#232a52; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1022; --surface:#161a33; --surface-2:#1b2040; --ink:#eef0ff; --muted:#a2a8cc; --line:#2a3058;
  --creed:#2dd4a7; --craft:#a78bfa; --commerce:#fbbf24; --care:#f472b6; --contrib:#38bdf8;
  --gold:#fbbf24; --indigo:#818cf8; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --effort:#818cf8; --self:#fbbf24; --verified:#34d399;
  --chip:#232a52; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky-a,#0b3b3a)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem} h3{font-size:.98rem}
p{margin:.4rem 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ar{font-family:var(--f-ar);direction:rtl}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* Sky band */
.sky{background:linear-gradient(120deg,var(--sky-a,#0b3b3a),var(--sky-b,#0f766e) 55%,var(--sky-c,#4c1d95));color:#fff;position:relative;overflow:hidden;transition:background .8s}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 200px at 85% -20%,rgba(255,255,255,.28),transparent 70%);pointer-events:none}
.sky .wrap{padding-block:14px 0;position:relative;z-index:1}
.basmala{text-align:center;font-family:var(--f-ar);font-size:1.35rem;opacity:.95;margin-bottom:6px;direction:rtl}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)}
.brand h1{font-size:1.2rem;font-weight:800}
.brand small{display:block;opacity:.88;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.datebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:10px;padding:6px 10px}
button.glass:hover{background:rgba(255,255,255,.26)}
.glass.date{text-align:center;padding:4px 12px}
.glass.date b{display:block;font-family:var(--f-display);font-size:.95rem}
.glass.date span{font-size:.76rem;opacity:.9}
.idx-pill{display:flex;align-items:center;gap:8px}
.idx-pill b{font-family:var(--f-display);font-size:1.15rem}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:#fff;text-decoration:none;padding:10px 13px;border-radius:12px 12px 0 0;font-weight:600;white-space:nowrap;opacity:.84;font-size:.9rem}
.tabs a:hover{opacity:1;background:rgba(255,255,255,.1)}
.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink);opacity:1}

main.wrap{padding-block:20px 40px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 16%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.banner p{margin:0}
.grid{display:grid;gap:16px}
.g-dash{grid-template-columns:repeat(12,minmax(0,1fr))}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
@media (max-width:1000px){.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--indigo)}
.btn.primary{background:linear-gradient(135deg,var(--sacred-a),#4c1d95);border-color:transparent;color:#fff}
.btn.gold{background:linear-gradient(135deg,#f5b301,#f08a24);border-color:transparent;color:#2a1a00}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 8px;font-size:.8rem;border-radius:8px}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--chip);white-space:nowrap}
.tone{background:color-mix(in srgb,var(--tc) 16%,transparent);color:color-mix(in srgb,var(--tc) 80%,var(--ink));border:1px solid color-mix(in srgb,var(--tc) 35%,transparent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.p-creed{--pc:var(--creed)}.p-craft{--pc:var(--craft)}.p-commerce{--pc:var(--commerce)}.p-contrib{--pc:var(--contrib)}
.pc-dot{background:var(--pc)}
.pc-chip{background:color-mix(in srgb,var(--pc) 16%,transparent);color:color-mix(in srgb,var(--pc) 75%,var(--ink))}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0;width:100%}
input[type=range]{width:100%;accent-color:var(--self)}
textarea{resize:vertical}
label.f{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
label.f > span.hint{font-weight:400;font-size:.74rem}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--c,var(--indigo))}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}
.tablewrap{overflow-x:auto}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:620px){.hero{grid-template-columns:1fr;justify-items:center}}
.ring{position:relative;width:180px;height:180px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .center b{font-family:var(--f-display);font-size:2.7rem;line-height:1}
.ring .center span{font-size:.74rem;color:var(--muted);font-weight:600}
.grade{font-family:var(--f-display);font-size:1.35rem;font-weight:800;background:linear-gradient(90deg,var(--creed),var(--contrib),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin-top:12px}
.comp{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.comp .lbl{font-size:.72rem;color:var(--muted);font-weight:600}
.comp b{font-family:var(--f-display);font-size:1.25rem}
.gapbox{margin-top:12px;border-radius:12px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--gc) 45%,var(--line));background:color-mix(in srgb,var(--gc) 10%,var(--surface));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.gapbox b.big{font-family:var(--f-display);font-size:1.6rem;color:var(--gc)}
.sacred-card{background:linear-gradient(140deg,var(--sacred-a),#134e4a 45%,#4c1d95);color:#fff;border:none}
.sacred-card .muted,.sacred-card .eyebrow{color:rgba(255,255,255,.85)}
.sacred-card .ar{font-size:1.5rem;line-height:1.6}
.sacred-card .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}

/* planner tiles */
.ptiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.ptiles{grid-template-columns:1fr}}
.ptile{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface-2);border-top:5px solid var(--pc);display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;position:relative;transition:transform .15s,box-shadow .15s}
.ptile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
@media (max-width:460px){.ptile{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ptile h3{font-size:1.05rem}
.ptile .ar{color:var(--pc);font-size:1.2rem}
.mring{width:124px;height:124px;position:relative;flex:none}
.mring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.mring .center b{font-family:var(--f-display);font-size:1.25rem;line-height:1;color:var(--verified)}
.mring .center span{font-size:.62rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.mini-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.mini-stats div{font-size:.7rem;color:var(--muted);font-weight:600}
.mini-stats b{display:block;font-family:var(--f-display);font-size:1rem;color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;font-size:.78rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.legend button.off{opacity:.4}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:.78rem;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--indigo);color:#fff}
.tip{position:fixed;pointer-events:none;z-index:80;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:10px;font-size:.78rem;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:pre-line;line-height:1.4}
svg .hit{cursor:pointer}
.col .vl{opacity:0}.col:hover .vl{opacity:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.kpi b{font-family:var(--f-display);font-size:1.45rem;display:block}
.kpi span{font-size:.76rem;color:var(--muted);font-weight:600}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{font-size:.76rem;color:var(--muted)}
@media (max-width:560px){.li{grid-template-columns:auto minmax(0,1fr)}.li > :last-child{grid-column:2}}
.sev{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.78rem;background:var(--sc,var(--muted))}

/* planner page */
.pswitch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
@media (max-width:760px){.pswitch{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pswitch a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);border-left:5px solid var(--pc)}
.pswitch a[aria-current="true"]{background:color-mix(in srgb,var(--pc) 14%,var(--surface));border-color:var(--pc)}
.pswitch b{font-family:var(--f-display);display:block;font-size:.92rem}
.pswitch small{color:var(--muted);font-size:.72rem}
.phead{border-top:5px solid var(--pc)}
.phead .ar{color:var(--pc);font-size:1.6rem}
.goal{border-left:5px solid var(--pc)}
.goal .niyyah{font-style:italic;color:color-mix(in srgb,var(--creed) 80%,var(--ink));font-size:.88rem}
.fruitline{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;margin-top:8px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.tri div{font-size:.74rem;color:var(--muted);font-weight:600}
.st-table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:820px}
.st-table th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line)}
.st-table td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.st-table td.t{min-width:220px}
.vb{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem}
.vb.verified{background:var(--verified)}.vb.claimed{background:var(--self)}.vb.open{background:color-mix(in srgb,var(--muted) 45%,var(--line))}.vb.overdue{background:var(--bad)}
.flag{display:inline-flex;margin:3px 4px 0 0;padding:1px 7px;border-radius:999px;font-size:.68rem;font-weight:700;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.flag.ok{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.mb{height:5px;border-radius:5px;background:var(--line);overflow:hidden;width:70px;margin-top:4px}
.mb i{display:block;height:100%;background:var(--c)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--indigo)}
.icon-btn svg{width:15px;height:15px}

/* adherence */
.adh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.adh{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);width:100%}
.adh .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff}
.adh.on{border-color:var(--creed);background:color-mix(in srgb,var(--creed) 10%,var(--surface))}
.adh.on .box{background:var(--creed);border-color:var(--creed)}
.adh b{font-family:var(--f-display);display:block;font-size:.9rem}
.adh span{font-size:.8rem;color:var(--muted)}
.heat{display:grid;grid-template-columns:auto repeat(8,minmax(0,1fr));gap:4px;font-size:.68rem;color:var(--muted);align-items:center}
.heat button{aspect-ratio:1;border-radius:5px;border:1px solid var(--line);padding:0;min-width:0;background:var(--surface-2)}
.heat button.sel{outline:2px solid var(--ink);outline-offset:1px}

/* tree */
.tree-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:radial-gradient(900px 300px at 0% 100%,color-mix(in srgb,var(--creed) 8%,transparent),transparent 70%),var(--surface-2)}
.tree-wrap svg{display:block}
.tree-wrap text{font-family:var(--f-body)}
.node{cursor:pointer}
.node:hover rect,.node:hover circle,.node:hover path.dia{filter:brightness(1.08);stroke-width:2.5}

/* model */
.thesis{background:linear-gradient(130deg,#0b3b3a,#134e4a 40%,#4c1d95);color:#fff;border:none;padding:28px}
.thesis h2{font-size:clamp(1.4rem,3vw,2.1rem);max-width:26ch}
.thesis p{max-width:70ch;opacity:.93}
.thesis .q{border-left:3px solid #fbbf24;padding-left:12px;margin-top:14px;font-size:.95rem}
.thesis .ar{font-size:1.5rem;line-height:1.8;margin-top:10px;opacity:.95}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.flow{grid-template-columns:1fr}}
.flow .st{border-radius:14px;padding:14px;color:#fff}
.flow .st b{font-family:var(--f-display);font-size:1.05rem;display:block}
.flow .st small{opacity:.92}
.soil{margin-top:10px;border-radius:14px;padding:12px 14px;background:linear-gradient(90deg,#7c2d12,var(--care));color:#fff}
.imp{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.imp .card{box-shadow:none;border-top:4px solid var(--tc)}
.imp .src{font-size:.76rem;color:var(--muted);margin-top:6px}
.refs{margin:0;padding-left:1.4rem;display:grid;gap:8px;font-size:.86rem}
.refs a{color:var(--indigo);font-weight:600}
.gateflow{display:grid;grid-template-columns:1.2fr repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}
@media (max-width:900px){.gateflow{grid-template-columns:1fr 1fr}}
.gateflow > div{border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--surface-2)}
.gateflow > div b{font-family:var(--f-display);display:block}

/* review */
.verdict{border-left:6px solid var(--tc)}
.verdict h3{font-size:1.1rem}
.verdict ul{margin:.4rem 0 0;padding-left:1.1rem;display:grid;gap:6px}
.statement{font-family:var(--f-display);font-size:1rem;line-height:1.6;padding:14px;border-radius:12px;background:var(--surface-2);border:1px dashed color-mix(in srgb,var(--gold) 60%,var(--line))}

/* profile */
.profile-hero{background:linear-gradient(130deg,#052e2b,#0f766e 45%,#4c1d95);color:#fff;border:none;padding:26px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media (max-width:640px){.profile-hero{grid-template-columns:1fr}}
.monogram{width:110px;height:110px;border-radius:28px;background:linear-gradient(135deg,#f5b301,#f08a24);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:2.4rem;color:#2a1a00;box-shadow:0 10px 30px rgba(0,0,0,.25)}

<script>
(function(){
"use strict";
/* ---------- utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dateOf=k=>{const[y,m,d]=String(k).split("-").map(Number);return new Date(y,m-1,d,12)};

const avg=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((p,c)=>p+c,0)/v.length:null};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const pct=v=>v==null?"–":Math.round(v*100)+"%";
const hrs=h=>(Math.round((+h||0)*10)/10)+"h";
const fmtD=k=>k?dateOf(k).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"No date";
const shortD=k=>k?dateOf(k).toLocaleDateString(undefined,{month:"short",day:"numeric"}):"—";
const longD=k=>dateOf(k).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
function hijri(k){const d=dateOf(k);for(const c of["islamic-umalqura","islamic"]){try{return new Intl.DateTimeFormat("en-u-ca-"+c,{day:"numeric",month:"long",year:"numeric"}).format(d)}catch(e){}}return""}
const LS="shajarah-verified-planner-v1";

/* ---------- framework constants ---------- */
const PL={
  creed:{name:"Creed",tree:"Roots",ar:"الجذور",title:"Roots Planner",sub:"Niyyah, worship and Tawheed-centred habits that hold the tree",cls:"p-creed",hex:"#0f9d76"},
  craft:{name:"Craft",tree:"Trunk",ar:"الجذع",title:"Trunk Planner",sub:"Skill, product building and itqan: the strength that carries the load",cls:"p-craft",hex:"#7c4dff"},
  commerce:{name:"Commerce",tree:"Branches",ar:"الأغصان",title:"Branches Planner",sub:"Halal earning, sales and operations that reach outward",cls:"p-commerce",hex:"#e39b06"},
  contrib:{name:"Contribution",tree:"Fruit",ar:"الثمار",title:"Fruit Planner",sub:"Sadaqah, zakat, mentoring and community: what the tree gives back",cls:"p-contrib",hex:"#0a95d6"}
};
const PK=["creed","craft","commerce","contrib"];
const ADH=[
  ["sidq","Sidq · honest report","I reported my progress honestly, with no inflation."],
  ["amal","'Amal · verified action","I took at least one action I can prove, not only a plan."],
  ["fear","Naming the fear","I named the fear I felt instead of hiding it behind busyness."],
  ["tawakkul","Tawakkul · tie the camel","I did my part, then left the result to Allah."],
  ["shura","Shura · hand-holding","I updated my accountability partner or sought counsel."],
  ["halal","Halal bounds","My work stayed halal and inside the bounds of prayer."]
];
const VAGUE=/\b(try|trying|think about|thinking about|explore|maybe|hopefully|someday|some day|soon|plan to|planning to|want to|wanting to|should|look into|looking into|consider|eventually|work on|working on|figure out|get around to|at some point|when i can|if i have time|insha'?allah later|one day)\b/gi;
const DEC={
  proceed:["Proceed","var(--good)","Fruit is on track. Keep the method and scale it."],
  pivot:["Pivot the method","var(--warn)","Effort is there, fruit is not. Change how; keep why."],
  recommit:["Recommit smaller","var(--craft)","Shrink the next step so it can be done and proved within 72 hours."],
  release:["Release with istikharah","var(--muted)","Let it go after istikharah and counsel, and record the lesson."]
};
const QUAD={
  fruit:["Bearing fruit","var(--good)","High effort and high completion. Keep verifying."],
  words:["Words outrunning deeds","var(--bad)","Completion is claimed without matching effort. Verify it or correct it."],
  labour:["Labouring roots","var(--warn)","Effort is high but completion is low. Seek counsel and change the method."],
  dormant:["Dormant seed","var(--muted)","Little effort and little progress. Fear often hides here. Take one 30-minute step today."],
  unplanted:["Unplanted","var(--muted)","No steps yet. A goal without steps is a wish."]
};
const RADAR=[
  ["vague","Vagueness","Steps are written as intentions, not actions. Vague words protect us from failing a clear test."],
  ["delay","Delay","Overdue steps with no update. Avoidance usually means the step feels too big or the result too exposed."],
  ["inflation","Inflation","Completion is reported higher than the evidence shows: the gap between saying and doing (Quran 61:2-3)."],
  ["dormancy","Dormancy","No effort has been logged recently. A dormant planner is often a feared planner."],
  ["indecision","Indecision","Decision gates passed with no recorded decision. Not deciding is a decision made by fear."]
];
const AYAT=[
  ["يَا أَيُّهَا الَّذِينَ آمَنُوا لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ","O you who have believed, why do you say what you do not do?","Quran 61:2"],
  ["أَصْلُهَا ثَابِتٌ وَفَرْعُهَا فِي السَّمَاءِ","Its root is firmly fixed and its branches are in the sky.","Quran 14:24"],
  ["فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ","And when you have decided, then rely upon Allah.","Quran 3:159"],
  ["وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ","And that there is not for man except that for which he strives.","Quran 53:39"],
  ["وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ","And say: Work, for Allah will see your deeds.","Quran 9:105"],
  ["وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ","And whoever relies upon Allah, He is sufficient for him.","Quran 65:3"],
  ["اعْقِلْهَا وَتَوَكَّلْ","Tie it, and rely upon Allah.","Hadith, Tirmidhi 2517"],
  ["احْرِصْ عَلَى مَا يَنْفَعُكَ وَاسْتَعِنْ بِاللَّهِ وَلَا تَعْجَزْ","Be keen on what benefits you, seek Allah's help, and do not give up.","Hadith, Muslim 2664"]
];
const TAWAKKUL=["Tie the camel, then trust Allah: your part is the verified step, the result is His.","Do not say \"if only\". Be keen on what benefits you, seek Allah's help, and do not give up.","The most beloved deeds to Allah are the most consistent, even if small.","A failed test you can see is better than a hidden plan you never test.","Report the true number. Sincerity in the small report is sincerity in the large one."];

/* ---------- state ---------- */
function defaultSettings(){return{
  brand:{name:"Professor Zaid Adib Ansari",cred:"ABD · Founder and Principal Consultant",org:"The Balanced Middle Path Academy, LLC",tagline:"Plans that bear verified fruit",client:"",
    bio:"30+ years of international higher education leadership across the United States, the UAE and Egypt. Institutional research, statistics, business intelligence and grant writing. Author of Cracked Mirrors: Emmett Till to Barack Obama and My Path to Authentic Islam.",location:"Kuala Lumpur, Malaysia"},
  theme:"auto",weekly:{creed:5,craft:12,commerce:10,contrib:3},proceedAt:70,
  partner:{name:"",cadence:"Weekly",contact:"",last:""},covenant:{text:"",signed:""},seeded:false,sampleDismissed:false}}
function emptyPlanners(){const o={};PK.forEach(p=>o[p]={goals:[],logs:[]});return o}
const S={settings:defaultSettings(),planners:emptyPlanners(),adherence:{}};
let route="dashboard",curP="creed",adhKey=todayKey(),trendMetric="effort",trendOn={creed:1,craft:1,commerce:1,contrib:1},radarSel="all",treeSel="all",scatterSel="all",repRange=30,convText="";
const findGoal=(p,gid)=>S.planners[p].goals.find(g=>g.id===gid);
function findStep(sid){for(const p of PK)for(const g of S.planners[p].goals){const s=g.steps.find(x=>x.id===sid);if(s)return{p,g,s}}return null}

/* ---------- measurement engine ---------- */
function checks(s){return[
  {k:"verb",ok:!new RegExp(VAGUE.source,"i").test(s.title||""),t:"Concrete action",bad:"Vague wording"},
  {k:"date",ok:!!s.due,t:"Due date",bad:"No date"},
  {k:"hours",ok:+s.hoursPlan>0,t:"Effort estimate",bad:"No hours"},
  {k:"proof",ok:!!String(s.proof||"").trim(),t:"Proof of done",bad:"No proof defined"},
  {k:"size",ok:!(+s.hoursPlan>8),t:"Small enough",bad:"Too big (>8h)"}]}
function quadOf(e,c,n){if(!n)return"unplanted";const E=e>=.5,C=c>=.5;return E&&C?"fruit":!E&&C?"words":E&&!C?"labour":"dormant"}
let CACHE=null;
function calc(){
  if(CACHE)return CACHE;
  const tk=todayKey(),out={p:{},g:{},s:{}};
  let AW=0,AE=0,AC=0,AV=0,AK=[],AConc=0,ANs=0,AHp=0,AHl=0,Agoals=0;
  for(const p of PK){
    const pl=S.planners[p],hmap={};let last=null;
    for(const l of pl.logs){hmap[l.stepId]=(hmap[l.stepId]||0)+(+l.hours||0);if(+l.hours>0&&(!last||l.date>last))last=l.date}
    let W=0,E=0,C=0,V=0,K=[],conc=0,ns=0,open=0,over=0,hp=0,hl=0,gPast=0,undec=0,claimNoEv=0;
    for(const g of pl.goals){
      let gw=0,ge=0,gc=0,gv=0,gconc=0,gover=0,gopen=0;
      for(const s of g.steps){
        const logged=hmap[s.id]||0,w=Math.max(.25,+s.hoursPlan||1);
        const eff=+s.hoursPlan>0?Math.min(1,logged/+s.hoursPlan):(logged>0?1:0);
        const self=clamp((+s.selfPct||0)/100,0,1),hasEv=!!String(s.evidence||"").trim();
        const ver=s.verified&&hasEv?self:0;
        const ch=checks(s),cs=ch.filter(c=>c.ok).length/ch.length;
        const isOver=!!s.due&&s.due<tk&&self<1;
        const status=ver>0&&self>=1?"verified":isOver?"overdue":ver>0?"verified":self>0?"claimed":"open";
        if(self>=.8&&!ver)claimNoEv++;
        out.s[s.id]={logged,eff,self,ver,ch,conc:cs,over:isOver,status,hasEv};
        gw+=w;ge+=w*eff;gc+=w*self;gv+=w*ver;gconc+=cs;if(self<1){gopen++;if(isOver)gover++}
        hp+=+s.hoursPlan||0;hl+=logged;
      }
      const n=g.steps.length,kpi=+g.kpiTarget>0?Math.min(1,(+g.kpiActual||0)/+g.kpiTarget):null;
      const gs={effort:gw?ge/gw:null,self:gw?gc/gw:null,verified:gw?gv/gw:null,kpi,conc:n?gconc/n:null,over:gover,open:gopen,w:gw,n};
      gs.gap=gs.self!=null?gs.self-gs.verified:null;
      gs.quad=quadOf(gs.effort||0,gs.self||0,n);
      gs.gate=gateOf(g,tk);gs.rec=recOf(gs);
      if(g.gate&&g.gate<=tk&&!(g.decision&&g.decision.choice)){gPast++;undec++}else if(g.gate&&g.gate<=tk)gPast++;
      out.g[g.id]=gs;
      W+=gw;E+=ge;C+=gc;V+=gv;if(kpi!=null)K.push(kpi);conc+=gconc;ns+=n;open+=gopen;over+=gover;
    }
    const ps={effort:W?E/W:null,self:W?C/W:null,verified:W?V/W:null,kpi:avg(K),conc:ns?conc/ns:null,n:ns,goals:pl.goals.length,open,over,hp,hl,last,
      dormant:last?daysBetween(last,tk):null,gPast,undec,claimNoEv,W};
    ps.gap=ps.self!=null?ps.self-ps.verified:null;
    ps.quad=quadOf(ps.effort||0,ps.self||0,ns);
    ps.radar={vague:ps.conc!=null?1-ps.conc:0,delay:open?over/open:0,inflation:ps.gap!=null?Math.min(1,Math.max(0,ps.gap)*2):0,
      dormancy:ns?(last?Math.min(1,ps.dormant/14):1):0,indecision:gPast?undec/gPast:0};
    ps.resist=ns?Math.round(avg(Object.values(ps.radar))*100):null;
    out.p[p]=ps;
    AW+=W;AE+=E;AC+=C;AV+=V;if(ps.kpi!=null)AK.push(ps.kpi);AConc+=conc;ANs+=ns;AHp+=hp;AHl+=hl;Agoals+=pl.goals.length;
  }
  const A={effort:AW?AE/AW:null,self:AW?AC/AW:null,verified:AW?AV/AW:null,kpi:avg(AK),conc:ANs?AConc/ANs:null,adh:adhScore(14),n:ANs,goals:Agoals,hp:AHp,hl:AHl};
  A.gap=A.self!=null?A.self-A.verified:null;
  const comp=[[.30,A.verified],[.25,A.effort],[.20,A.kpi],[.15,A.adh],[.10,A.conc]];let num=0,den=0;for(const[w,v]of comp)if(v!=null){num+=w*v;den+=w}
  A.index=den&&ANs?Math.round(num/den*100):null;
  const rr={};for(const[k]of RADAR)rr[k]=avg(PK.filter(p=>out.p[p].n).map(p=>out.p[p].radar[k]))||0;A.radar=rr;
  A.resist=ANs?Math.round(avg(Object.values(rr))*100):null;
  out.all=A;CACHE=out;return out;
}
function gateOf(g,tk){
  if(!g.gate)return{st:"none"};
  if(g.decision&&g.decision.choice)return{st:"decided",choice:g.decision.choice};
  if(g.gate>tk)return{st:"pending",days:daysBetween(tk,g.gate)};
  const late=daysBetween(g.gate,tk);return{st:late>3?"avoided":"due",late};
}
function recOf(gs){
  const at=(+S.settings.proceedAt||70)/100;
  if(!gs.n)return["recommit","Plant the first verified step before deciding anything."];
  if(gs.kpi!=null&&gs.kpi>=at)return["proceed",`Fruit KPI is at ${pct(gs.kpi)}, above the ${Math.round(at*100)}% proceed line.`];
  if(gs.self>=.5&&gs.gap>.25)return["verify",`You report ${pct(gs.self)} but can prove ${pct(gs.verified)}. Attach evidence before you decide.`];
  if(gs.effort>=.6)return["pivot",`Effort is ${pct(gs.effort)} of plan but the fruit KPI is ${pct(gs.kpi)}. The method, not the intention, needs to change.`];
  return["recommit",`Effort is ${pct(gs.effort)} of plan. Shrink the next step until it can be done this week.`];
}
function adhScore(n,end){end=end||todayKey();let t=0;for(let i=0;i<n;i++){const d=S.adherence[addDays(end,-i)];if(d)t+=ADH.filter(a=>d.items&&d.items[a[0]]).length/ADH.length}return t/n}
function gradeOf(s){if(s==null)return["Not yet planted","Add a goal and its first verified step to start measuring."];
  if(s>=85)return["Shajarah Tayyibah","A good tree: firm roots and fruit you can prove."];
  if(s>=70)return["Firm roots, growing","Strong and honest. Close the remaining word-deed gap."];
  if(s>=55)return["Taking root","Real progress. One planner needs water this week."];
  if(s>=40)return["Seedling","The plan is ahead of the proof. Verify before you add more."];
  return["Words, not yet deeds","Start with one small step you can prove within 72 hours."]}
const toneColor=v=>v==null?"var(--muted)":v>=.7?"var(--good)":v>=.45?"var(--warn)":"var(--bad)";
const gapColor=g=>g==null?"var(--muted)":g<=.1?"var(--good)":g<=.25?"var(--warn)":"var(--bad)";

/* trend: 8 seven-day windows ending today */
function trendData(){
  const tk=todayKey(),wins=[...Array(8)].map((_,i)=>{const end=addDays(tk,-7*(7-i));return{start:addDays(end,-6),end}});
  const eff={},comp={};
  for(const p of PK){
    const pl=S.planners[p],target=Math.max(.5,+S.settings.weekly[p]||1);
    eff[p]=wins.map(w=>pl.logs.filter(l=>l.date>=w.start&&l.date<=w.end).reduce((a,l)=>a+(+l.hours||0),0)/target);
    const steps=pl.goals.flatMap(g=>g.steps);
    comp[p]=wins.map(w=>{if(!steps.length)return null;let W=0,C=0;for(const s of steps){const ww=Math.max(.25,+s.hoursPlan||1);
      const ls=pl.logs.filter(l=>l.stepId===s.id&&l.date<=w.end).sort((a,b)=>a.date<b.date?-1:1);W+=ww;C+=ww*((ls.length?+ls[ls.length-1].pct:0)/100)}return W?C/W:null});
  }
  return{wins,eff,comp};
}

/* ---------- sample data ---------- */
function seedSample(){
  const tk=todayKey();let rnd=11;const rand=()=>{rnd=(rnd*9301+49297)%233280;return rnd/233280};
  const mk=(p,goal,steps)=>{
    const g={id:uid(),sample:true,steps:[],fears:[],history:[],decision:null,title:goal.title,niyyah:goal.niyyah,kpiName:goal.kpiName,kpiUnit:goal.kpiUnit,kpiTarget:goal.kpiTarget,kpiActual:goal.kpiActual,deadline:addDays(tk,goal.deadline),gate:goal.gate==null?"":addDays(tk,goal.gate)};
    if(goal.decision)g.decision={choice:goal.decision[0],date:addDays(tk,goal.decision[1]),reason:goal.decision[2]};
    for(const[title,dueOff,hp,logged,self,proof,evidence,verified,win,n]of steps){
      const s={id:uid(),title,due:dueOff==null?"":addDays(tk,dueOff),hoursPlan:hp,proof,evidence:evidence||"",verified:!!verified,verifiedBy:verified?"Accountability partner":"",selfPct:self,sample:true};
      g.steps.push(s);
      const cnt=Math.max(n,(self>0||logged>0)?1:0);let used=0;
      for(let i=0;i<cnt;i++){const last=i===cnt-1,ago=cnt===1?win[1]:Math.round(win[0]-(win[0]-win[1])*i/(cnt-1));
        const h=last?Math.max(0,Math.round((logged-used)*4)/4):Math.round(logged/cnt*4)/4;used+=h;

/* ---------- persistence: this browser always, private account rows when signed in ---------- */
let dirty=new Set(),saveTimer=null,dbApi=null,userId=null,writing=false;
const DOCS=["meta",...PK.map(p=>"planner-"+p)];
function touch(...docs){CACHE=null;(docs.length?docs:DOCS).forEach(d=>dirty.add(d));save()}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500)}
function docData(name){if(name==="meta")return{json:JSON.stringify({settings:S.settings,adherence:S.adherence})};return{json:JSON.stringify(S.planners[name.slice(8)])}}
async function flush(){
  S.settings.seeded=true;lsSet(LS,JSON.stringify(S));
  if(!dbApi||!userId||writing){if(!dbApi)dirty.clear();return}
  writing=true;
  try{const base="data/users/"+userId,names=[...dirty];dirty.clear();for(const n of names)await dbApi.doc(base+"/"+n).set(docData(n))}
  catch(e){console.warn("Account save failed",e)}
  writing=false;if(dirty.size)save();
}
function hydrate(o){
  if(!o)return false;
  S.settings=Object.assign(defaultSettings(),o.settings||{});
  S.settings.brand=Object.assign(defaultSettings().brand,(o.settings||{}).brand||{});
  S.settings.weekly=Object.assign(defaultSettings().weekly,(o.settings||{}).weekly||{});
  S.planners=emptyPlanners();for(const p of PK)if(o.planners&&o.planners[p])S.planners[p]={goals:o.planners[p].goals||[],logs:o.planners[p].logs||[]};
  S.adherence=o.adherence||{};CACHE=null;return true;
}
function loadLocal(){const raw=lsGet(LS);if(!raw)return false;try{return hydrate(JSON.parse(raw))}catch(e){return false}}
async function connectDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;const id=await user.id();if(!id)return;
    dbApi=db;userId=id;
    const snap=await Promise.race([db.collection("data/users/"+id).get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    if(snap.empty){touch();return}
    const o={planners:{}};
    for(const d of snap.docs){try{const v=JSON.parse((d.data()||{}).json||"null");if(!v)continue;if(d.id==="meta"){o.settings=v.settings;o.adherence=v.adherence}else if(d.id.startsWith("planner-"))o.planners[d.id.slice(8)]=v}catch(e){}}
    if(o.settings){hydrate(o);lsSet(LS,JSON.stringify(S));applyTheme();render();toast("Synced with your account")}
  }catch(e){console.warn("Account storage unavailable",e)}
}

/* ---------- small renderers ---------- */
function ringSvg(v,size=180,stroke=16,id="rg"){
  const r=(size-stroke)/2,c=2*Math.PI*r,p=v==null?0:clamp(v,0,100)/100;
  return`<svg viewBox="0 0 ${size} ${size}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f9d76"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#f5b301"/></linearGradient></defs>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c*p} ${c}"/></svg>`}
function dualRing(e,s,v,tip){
  const arc=(r,val,col,w)=>{const c=2*Math.PI*r,p=val==null?0:clamp(val,0,1);return`<circle cx="62" cy="62" r="${r}" fill="none" stroke="var(--line)" stroke-width="${w}"/><circle cx="62" cy="62" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c*p} ${c}"/>`};
  return`<div class="mring" data-tip="${esc(tip)}"><svg viewBox="0 0 124 124">${arc(54,e,"var(--effort)",10)}${arc(40,s,"var(--self)",10)}</svg><div class="center"><b class="num">${pct(v)}</b><span>verified</span></div></div>`}
function compTile(lbl,v,col,w,tip){return`<div class="comp" data-tip="${esc(tip)}"><div class="lbl">${lbl} <span class="muted">· ${w}%</span></div><b class="num">${pct(v)}</b><div class="bar"><i style="width:${v==null?0:clamp(v,0,1)*100}%;--c:${col}"></i></div></div>`}
const mb=(v,c)=>`<div class="mb"><i style="width:${v==null?0:clamp(v,0,1)*100}%;--c:${c}"></i></div>`;
const tone=(txt,c)=>`<span class="chip tone" style="--tc:${c}">${txt}</span>`;
function gateChip(gs){const G=gs.gate;
  if(G.st==="none")return tone("No decision gate","var(--muted)");
  if(G.st==="decided")return tone("Decided: "+DEC[G.choice][0],DEC[G.choice][1]);
  if(G.st==="pending")return tone(`Gate in ${G.days} day${G.days===1?"":"s"}`,"var(--indigo)");
  if(G.st==="due")return tone("Decision due now","var(--warn)");
  return tone(`Decision avoided ${G.late} days`,"var(--bad)")}

/* ---------- charts ---------- */
function scatterSvg(){
  const C=calc(),W=560,H=360,L=44,R=14,T=14,B=40,x=v=>L+(W-L-R)*v,y=v=>T+(H-T-B)*(1-v);
  let g=`<rect x="${x(.5)}" y="${y(1)}" width="${x(1)-x(.5)}" height="${y(.5)-y(1)}" fill="var(--good)" opacity=".07"/><rect x="${x(0)}" y="${y(1)}" width="${x(.5)-x(0)}" height="${y(.5)-y(1)}" fill="var(--bad)" opacity=".07"/><rect x="${x(.5)}" y="${y(.5)}" width="${x(1)-x(.5)}" height="${y(0)-y(.5)}" fill="var(--warn)" opacity=".07"/><rect x="${x(0)}" y="${y(.5)}" width="${x(.5)-x(0)}" height="${y(0)-y(.5)}" fill="var(--muted)" opacity=".07"/>`;
  for(const v of[0,.25,.5,.75,1]){g+=`<line x1="${x(0)}" x2="${x(1)}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v*100}%</text><line y1="${y(0)}" y2="${y(1)}" x1="${x(v)}" x2="${x(v)}" stroke="var(--line)"/><text x="${x(v)}" y="${y(0)+14}" text-anchor="middle" font-size="10" fill="var(--muted)">${v*100}%</text>`}
  g+=`<text x="${x(.98)}" y="${y(.97)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--good)">Bearing fruit</text><text x="${x(.02)}" y="${y(.97)}" font-size="11" font-weight="700" fill="var(--bad)">Words outrunning deeds</text><text x="${x(.98)}" y="${y(.03)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--warn)">Labouring roots</text><text x="${x(.02)}" y="${y(.03)}" font-size="11" font-weight="700" fill="var(--muted)">Dormant seed</text>`;
  g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">Effort (hours logged ÷ hours planned) →</text><text transform="translate(12 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="11" font-weight="600" fill="var(--muted)">Self-reported completion →</text>`;
  let pts="";
  for(const p of PK){if(scatterSel!=="all"&&scatterSel!==p)continue;for(const gl of S.planners[p].goals){const s=C.g[gl.id];if(!s.n)continue;
    const r=clamp(6+Math.sqrt(s.w)*1.7,7,22),cx=x(clamp(s.effort,0,1)),cy=y(clamp(s.self,0,1));
    const tip=`${gl.title}\n${PL[p].title}\nEffort ${pct(s.effort)} · Self-reported ${pct(s.self)}\nVerified ${pct(s.verified)} · Gap ${Math.round(s.gap*100)} pts\nFruit KPI ${pct(s.kpi)}\n${QUAD[s.quad][0]}`;
    pts+=`<g class="hit" data-act="openGoal" data-p="${p}" data-g="${gl.id}" data-tip="${esc(tip)}">${s.gap>.25?`<circle cx="${cx}" cy="${cy}" r="${r+5}" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="4 3"/>`:""}<circle cx="${cx}" cy="${cy}" r="${r}" fill="${PL[p].hex}" fill-opacity=".78" stroke="var(--surface)" stroke-width="2"/></g>`}}
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Scatter of goals by effort and self-reported completion">${g}${pts}</svg>`;
}
function barsSvg(){
  const C=calc(),W=420,H=250,L=34,B=40,T=18,cw=(W-L-6)/4,y=v=>T+(H-T-B)*(1-v);
  let g="";for(const v of[0,.25,.5,.75,1])g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v*100}</text>`;
  PK.forEach((p,i)=>{const s=C.p[p],bw=cw*.22,x0=L+i*cw+cw*.14;
    [["effort","var(--effort)","Effort"],["self","var(--self)","Self-reported"],["verified","var(--verified)","Verified"]].forEach(([k,c,l],j)=>{const v=s[k]==null?0:clamp(s[k],0,1);
      g+=`<g class="hit" data-act="goPlan" data-p="${p}" data-tip="${esc(PL[p].title+"\n"+l+": "+pct(s[k]))}"><rect x="${x0+j*(bw+3)}" y="${y(v)}" width="${bw}" height="${Math.max(1,y(0)-y(v))}" rx="3" fill="${c}"/></g>`});
    if(s.gap!=null&&s.gap>.05)g+=`<text x="${x0+1.5*bw+3}" y="${y(Math.max(s.self||0,s.effort||0))-5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${gapColor(s.gap)}">gap ${Math.round(s.gap*100)}</text>`;
    g+=`<text x="${x0+1.5*bw+3}" y="${H-22}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${PL[p].hex}">${PL[p].name}</text><text x="${x0+1.5*bw+3}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${PL[p].tree}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Grouped bars per planner">${g}</svg>`;
}
function trendSvg(){
  const D=trendData(),W=720,H=270,L=42,R=14,T=14,B=30,maxV=trendMetric==="effort"?1.5:1,x=i=>L+i*(W-L-R)/7,y=v=>T+(H-T-B)*(1-clamp(v,0,maxV)/maxV);
  let g="";const ticks=trendMetric==="effort"?[0,.5,1,1.5]:[0,.25,.5,.75,1];
  for(const v of ticks)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===1&&trendMetric==="effort"?'stroke-dasharray="5 4" stroke-width="1.5"':""}/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(v*100)}%</text>`;
  if(trendMetric==="effort")g+=`<text x="${W-R}" y="${y(1)-5}" text-anchor="end" font-size="10" fill="var(--muted)">weekly target</text>`;
  const series=trendMetric==="effort"?D.eff:D.comp;let lines="";
  for(const p of PK){if(!trendOn[p])continue;const pts=series[p].map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)continue;
    lines+=`<polyline points="${pts.map(q=>q.join(",")).join(" ")}" fill="none" stroke="${PL[p].hex}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`+pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.6" fill="var(--surface)" stroke="${PL[p].hex}" stroke-width="2"/>`).join("")}
  let cols="";D.wins.forEach((w,i)=>{const tip=`Week ${shortD(w.start)} to ${shortD(w.end)}\n`+PK.filter(p=>trendOn[p]).map(p=>`${PL[p].name}: ${series[p][i]==null?"–":pct(series[p][i])}${trendMetric==="effort"?` (${hrs(series[p][i]*(+S.settings.weekly[p]||1))})`:""}`).join("\n");
    const cw=(W-L-R)/7;cols+=`<g class="col" data-tip="${esc(tip)}"><line class="vl" x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3"/><rect x="${x(i)-cw/2}" y="${T}" width="${cw}" height="${H-T-B}" fill="transparent"/></g><text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--muted)">${shortD(w.end)}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Eight week trend by planner">${g}${lines}${cols}</svg>`;
}
function radarSvg(R,col,size){
  const c=size/2,rad=size/2-46,n=RADAR.length,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[c+Math.cos(a)*rad*v,c+Math.sin(a)*rad*v]};
  let g="";for(const v of[.25,.5,.75,1])g+=`<polygon points="${RADAR.map((_,i)=>pt(i,v).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`;
  RADAR.forEach(([k,l,d],i)=>{const[x2,y2]=pt(i,1),[lx,ly]=pt(i,1.2);g+=`<line x1="${c}" y1="${c}" x2="${x2}" y2="${y2}" stroke="var(--line)"/><text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)" data-tip="${esc(l+": "+pct(R[k])+"\n"+d)}">${l}</text>`});
  g+=`<polygon points="${RADAR.map(([k],i)=>pt(i,Math.max(.03,R[k]||0)).join(",")).join(" ")}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="2.2"/>`;
  RADAR.forEach(([k,l,d],i)=>{const[px,py]=pt(i,Math.max(.03,R[k]||0));g+=`<circle cx="${px}" cy="${py}" r="5" fill="${col}" class="hit" data-tip="${esc(l+": "+pct(R[k])+"\n"+d)}"/>`});
  return`<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size+40}px;height:auto;display:block;margin:auto" role="img" aria-label="Resistance radar">${g}</svg>`;
}

/* ---------- flags ---------- */
function flags(){
  const C=calc(),out=[],tk=todayKey();
  for(const p of PK){const ps=C.p[p];
    if(ps.n&&ps.dormant!=null&&ps.dormant>=7)out.push({sev:3,p,text:`${PL[p].title} has had no effort logged for ${ps.dormant} days`,why:"Dormancy",act:`data-act="log" data-p="${p}"`,btn:"Log effort"});
    if(ps.n&&ps.last==null)out.push({sev:3,p,text:`${PL[p].title} has steps but no effort has ever been logged`,why:"Dormancy",act:`data-act="log" data-p="${p}"`,btn:"Log effort"});
    for(const g of S.planners[p].goals){const gs=C.g[g.id];
      if(gs.gate.st==="avoided")out.push({sev:5,p,text:`Decision avoided ${gs.gate.late} days: “${g.title}”`,why:"Indecision",act:`data-act="decide" data-p="${p}" data-g="${g.id}"`,btn:"Decide"});
      else if(gs.gate.st==="due")out.push({sev:4,p,text:`Decision due: “${g.title}”`,why:"Indecision",act:`data-act="decide" data-p="${p}" data-g="${g.id}"`,btn:"Decide"});
      if(!(+g.kpiTarget>0))out.push({sev:3,p,text:`No measurable fruit target on “${g.title}”`,why:"Vagueness",act:`data-act="editGoal" data-p="${p}" data-g="${g.id}"`,btn:"Set target"});
      if(!g.steps.length)out.push({sev:3,p,text:`“${g.title}” has no steps. It is still a wish.`,why:"Vagueness",act:`data-act="newStep" data-p="${p}" data-g="${g.id}"`,btn:"Add step"});
      if(!g.gate)out.push({sev:2,p,text:`No decision gate set on “${g.title}”`,why:"Indecision",act:`data-act="editGoal" data-p="${p}" data-g="${g.id}"`,btn:"Set gate"});
      for(const s of g.steps){const st=C.s[s.id],ref=`data-p="${p}" data-g="${g.id}" data-s="${s.id}"`;
        if(st.self>=.8&&!st.ver)out.push({sev:4,p,text:`Claimed ${Math.round(st.self*100)}% with no verified evidence: “${s.title}”`,why:"Inflation",act:`data-act="editStep" ${ref}`,btn:"Attach proof"});
        if(st.over)out.push({sev:4,p,text:`Overdue since ${shortD(s.due)}: “${s.title}”`,why:"Delay",act:`data-act="editStep" ${ref}`,btn:"Re-plan"});
        if(st.self<1)for(const c of st.ch)if(!c.ok)out.push({sev:c.k==="verb"||c.k==="date"?3:2,p,text:`${c.bad}: “${s.title}”`,why:"Vagueness",act:`data-act="editStep" ${ref}`,btn:"Fix"});
      }}}
  return out.sort((a,b)=>b.sev-a.sev);
}
function flagRow(f){const c=f.sev>=5?"var(--bad)":f.sev>=4?"#e0603a":f.sev>=3?"var(--warn)":"var(--muted)";
  return`<div class="li ${PL[f.p].cls}"><span class="sev" style="--sc:${c}" title="Severity ${f.sev} of 5">${f.sev}</span><div style="min-width:0"><div class="t">${esc(f.text)}</div><div class="s"><span class="chip pc-chip">${PL[f.p].name}</span> · ${f.why}</div></div><button class="btn sm" ${f.act}>${f.btn}</button></div>`}

  <div class="grid">
  <section class="card phead ${P.cls}">

        <div class="kpi"><b class="num" style="color:var(--self)">${pct(s.self)}</b><span>Self-reported completion</span></div>
        <div class="kpi"><b class="num" style="color:var(--verified)">${pct(s.verified)}</b><span>Verified completion</span></div>
        <div class="kpi"><b class="num" style="color:${gapColor(s.gap)}">${s.gap==null?"–":Math.round(s.gap*100)}</b><span>Word-deed gap (points)</span></div>

      </div>

  </div>`;
}
function goalCard(p,g){
  const C=calc(),gs=C.g[g.id],q=QUAD[gs.quad];
  const rows=g.steps.map(s=>{const st=C.s[s.id],ref=`data-p="${p}" data-g="${g.id}" data-s="${s.id}"`,sym={verified:"✓",claimed:"~",open:"·",overdue:"!"}[st.status];
    const bad=st.ch.filter(c=>!c.ok);
    return`<tr><td><span class="vb ${st.status}" title="${st.status}">${sym}</span></td>
      <td class="t"><b>${esc(s.title)}</b>${s.proof?`<div class="muted small">Proof: ${esc(s.proof)}</div>`:""}<div>${bad.length?bad.map(c=>`<span class="flag">${c.bad}</span>`).join(""):`<span class="flag ok">Concrete</span>`}</div></td>
      <td class="num" style="${st.over?"color:var(--bad);font-weight:700":""}">${s.due?shortD(s.due):"—"}</td>
      <td class="num">${+s.hoursPlan?hrs(s.hoursPlan):"—"}</td>
      <td class="num">${hrs(st.logged)}${mb(st.eff,"var(--effort)")}</td>
      <td class="num">${Math.round(st.self*100)}%${mb(st.self,"var(--self)")}</td>
      <td style="max-width:200px">${st.hasEv?`<span style="overflow-wrap:anywhere">${esc(s.evidence)}</span>${s.verified?`<div class="small" style="color:var(--verified);font-weight:700">Verified${s.verifiedBy?" by "+esc(s.verifiedBy):""}</div>`:`<div class="small" style="color:var(--warn);font-weight:700">Not yet verified</div>`}`:`<span class="muted">—</span>`}</td>
      <td><div class="row" style="flex-wrap:nowrap;gap:4px"><button class="icon-btn" data-act="log" ${ref} title="Log effort" aria-label="Log effort">${I.clock}</button><button class="icon-btn" data-act="editStep" ${ref} title="Edit step" aria-label="Edit step">${I.edit}</button><button class="icon-btn" data-act="delStep" ${ref} title="Delete step" aria-label="Delete step">${I.trash}</button></div></td></tr>`}).join("");
  return`<section class="card goal ${PL[p].cls}" id="goal-${g.id}">
    <div class="card-h" style="margin-bottom:4px"><div style="min-width:0"><h3 style="font-size:1.08rem">${esc(g.title)}</h3>${g.niyyah?`<div class="niyyah">Niyyah: ${esc(g.niyyah)}</div>`:""}</div>
      <div class="row">${tone(q[0],q[1])}${gateChip(gs)}<button class="btn sm" data-act="decide" data-p="${p}" data-g="${g.id}">${I.gate} Gate</button><button class="icon-btn" data-act="editGoal" data-p="${p}" data-g="${g.id}" aria-label="Edit goal">${I.edit}</button><button class="icon-btn" data-act="delGoal" data-p="${p}" data-g="${g.id}" aria-label="Delete goal">${I.trash}</button></div></div>
    <div class="fruitline"><div><div class="eyebrow">Fruit · measurable outcome</div><b>${esc(g.kpiName||"No outcome measure yet")}</b> <span class="muted num">${+g.kpiActual||0} of ${+g.kpiTarget||"?"} ${esc(g.kpiUnit||"")}${g.deadline?" · by "+esc(fmtD(g.deadline)):""}</span><div class="bar" style="height:9px"><i style="width:${gs.kpi==null?0:gs.kpi*100}%;--c:linear-gradient(90deg,var(--gold),var(--good))"></i></div></div>
      <label class="f">Update actual<input type="number" step="any" data-kpi="${g.id}" data-p="${p}" value="${+g.kpiActual||0}"></label></div>
    <div class="tri"><div>Effort ${pct(gs.effort)}<div class="bar"><i style="width:${(gs.effort||0)*100}%;--c:var(--effort)"></i></div></div><div>Self-reported ${pct(gs.self)}<div class="bar"><i style="width:${(gs.self||0)*100}%;--c:var(--self)"></i></div></div><div>Verified ${pct(gs.verified)}<div class="bar"><i style="width:${(gs.verified||0)*100}%;--c:var(--verified)"></i></div></div></div>
    <div class="tablewrap">${g.steps.length?`<table class="st-table"><thead><tr><th></th><th>Verified step (leaf)</th><th>Due</th><th>Plan</th><th>Logged · effort</th><th>Self-report</th><th>Evidence</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">No steps yet. Write the first step as an action you could film: a verb, a date, hours and a proof of done.</div>`}</div>
    <div class="row" style="margin-top:10px;justify-content:space-between"><div class="row"><button class="btn sm primary" data-act="newStep" data-p="${p}" data-g="${g.id}">${I.plus} Add step</button><button class="btn sm" data-act="newFear" data-p="${p}" data-g="${g.id}">Name a fear</button></div>
      <span class="muted small">${(g.fears||[]).length} fear${(g.fears||[]).length===1?"":"s"} named · ${g.steps.length} step${g.steps.length===1?"":"s"}</span></div>
  </section>`;

/* ---------- decision tree ---------- */

function treeSvg(){
  const C=calc(),ps=PK.filter(p=>treeSel==="all"||treeSel===p),rowH=36,top=46;
  const X={root:70,pl:220,goal:420,gate:600,step:660,fruit:1080},W=1150;
  let row=0;const nodes=[],links=[];const tr=(s,n)=>s.length>n?s.slice(0,n-1)+"…":s;
  const plNodes=[];
  for(const p of ps){const gy=[];
    const goals=S.planners[p].goals;
    if(!goals.length){const y=top+row*rowH+rowH/2;row++;gy.push(y);plNodes.push({p,y,empty:true});continue}
    for(const g of goals){const ys=[];const gs=C.g[g.id];
      if(!g.steps.length){ys.push(top+row*rowH+rowH/2);row++}
      for(const s of g.steps){const y=top+row*rowH+rowH/2;row++;ys.push(y);
        const st=C.s[s.id],col=st.status==="verified"?"var(--verified)":st.status==="overdue"?"var(--bad)":st.status==="claimed"?"var(--self)":"var(--line)";
        nodes.push(`<g class="node" data-act="editStep" data-p="${p}" data-g="${g.id}" data-s="${s.id}" data-tip="${esc(`${s.title}\nSelf-reported ${pct(st.self)} · Effort ${pct(st.eff)}\n${st.ver?"Verified: "+s.evidence:st.hasEv?"Evidence attached, not verified":"No evidence yet"}${s.due?"\nDue "+fmtD(s.due):""}`)}"><circle cx="${X.step}" cy="${y}" r="8" fill="${col}" stroke="${st.status==="open"?"var(--muted)":"var(--surface)"}" stroke-width="1.5"/><text x="${X.step+14}" y="${y+4}" font-size="11.5" fill="var(--ink)">${esc(tr(s.title,44))}</text><text x="${X.fruit-60}" y="${y+4}" font-size="10.5" text-anchor="end" fill="var(--muted)" class="num">${Math.round(st.self*100)}%</text></g>`);
        links.push([X.gate+12,0,X.step-8,y,PL[p].hex,g.id]);
      }
      const y=(Math.min(...ys)+Math.max(...ys))/2;gy.push(y);
      links.forEach(l=>{if(l[5]===g.id&&l[1]===0)l[1]=y});
      links.push([X.goal+80,y,X.gate-12,y,PL[p].hex]);
      const G=gs.gate,dc=G.st==="decided"?DEC[G.choice][1]:G.st==="avoided"?"var(--bad)":G.st==="due"?"var(--warn)":"var(--surface)";
      nodes.push(`<g class="node" data-act="editGoal" data-p="${p}" data-g="${g.id}" data-tip="${esc(`${g.title}\nNiyyah: ${g.niyyah||"—"}\nEffort ${pct(gs.effort)} · Self ${pct(gs.self)} · Verified ${pct(gs.verified)}\n${QUAD[gs.quad][0]}`)}"><rect x="${X.goal-80}" y="${y-15}" width="160" height="30" rx="9" fill="color-mix(in srgb,${PL[p].hex} 16%,var(--surface))" stroke="${PL[p].hex}" stroke-width="1.5"/><text x="${X.goal}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${esc(tr(g.title,24))}</text></g>`);
      nodes.push(`<g class="node" data-act="decide" data-p="${p}" data-g="${g.id}" data-tip="${esc(`Decision gate${g.gate?" · "+fmtD(g.gate):" · not set"}\n${G.st==="decided"?"Decided: "+DEC[G.choice][0]:G.st==="avoided"?"Avoided for "+G.late+" days":G.st==="due"?"Due now":G.st==="pending"?"In "+G.days+" days":"No gate"}\nSuggested: ${gs.rec[0]==="verify"?"Verify first":DEC[gs.rec[0]][0]}`)}"><path class="dia" d="M${X.gate} ${y-13} L${X.gate+13} ${y} L${X.gate} ${y+13} L${X.gate-13} ${y} Z" fill="${dc}" stroke="${G.st==="pending"||G.st==="none"?"var(--muted)":dc}" stroke-width="1.8"/></g>`);
      const fr=gs.kpi==null?6:7+gs.kpi*11,fc=gs.kpi==null?"var(--line)":gs.kpi>=.7?"var(--good)":gs.kpi>=.35?"var(--gold)":"var(--bad)";
      nodes.push(`<g class="node" data-act="editGoal" data-p="${p}" data-g="${g.id}" data-tip="${esc(`Fruit: ${g.kpiName||"no measure"}\n${+g.kpiActual||0} of ${+g.kpiTarget||"?"} ${g.kpiUnit||""} (${pct(gs.kpi)})`)}"><line x1="${X.gate+13}" y1="${y}" x2="${X.fruit-fr}" y2="${y}" stroke="${PL[p].hex}" stroke-opacity=".18" stroke-width="2" stroke-dasharray="2 5"/><circle cx="${X.fruit}" cy="${y}" r="${fr}" fill="${fc}" stroke="var(--surface)" stroke-width="2"/><text x="${X.fruit+24}" y="${y+4}" font-size="11" font-weight="700" fill="var(--ink)" class="num">${pct(gs.kpi)}</text></g>`);
    }
    plNodes.push({p,y:(Math.min(...gy)+Math.max(...gy))/2,gys:gy});
  }
  const H=Math.max(top+row*rowH+16,220),ry=(Math.min(...plNodes.map(n=>n.y))+Math.max(...plNodes.map(n=>n.y)))/2||H/2;
  for(const n of plNodes){links.push([X.root+38,ry,X.pl-62,n.y,PL[n.p].hex,null,3]);(n.gys||[]).forEach(gy=>links.push([X.pl+62,n.y,X.goal-80,gy,PL[n.p].hex,null,2.2]));
    const s=C.p[n.p];nodes.push(`<g class="node" data-act="goPlan" data-p="${n.p}" data-tip="${esc(`${PL[n.p].title}\nEffort ${pct(s.effort)} · Self ${pct(s.self)} · Verified ${pct(s.verified)}`)}"><rect x="${X.pl-62}" y="${n.y-20}" width="124" height="40" rx="12" fill="${PL[n.p].hex}"/><text x="${X.pl}" y="${n.y-3}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${PL[n.p].title.replace(" Planner","")}</text><text x="${X.pl}" y="${n.y+12}" text-anchor="middle" font-size="10" fill="#fff" opacity=".9">${PL[n.p].name} · ${pct(s.verified)}</text></g>`)}
  const path=([x1,y1,x2,y2,c,_,w])=>{const mx=(x1+x2)/2;return`<path d="M${x1} ${y1} C${mx} ${y1},${mx} ${y2},${x2} ${y2}" fill="none" stroke="${c}" stroke-opacity=".55" stroke-width="${w||1.6}"/>`};
  const heads=[[X.root,"Niyyah · root"],[X.pl,"Planner"],[X.goal,"Goal · branch"],[X.gate,"Gate"],[X.step+60,"Verified steps · leaves"],[X.fruit,"Fruit · KPI"]].map(([x,t])=>`<text x="${x}" y="22" text-anchor="middle" font-size="10" font-weight="800" letter-spacing=".08em" fill="var(--muted)">${t.toUpperCase()}</text>`).join("");
  const root=`<g data-tip="${esc("Root: Tawheed and sincere intention (ikhlas).\nEvery branch must trace back here.")}"><circle cx="${X.root}" cy="${ry}" r="38" fill="url(#rootg)"/><text x="${X.root}" y="${ry-2}" text-anchor="middle" font-size="15" fill="#fff" style="font-family:var(--f-ar)">لا إله إلا الله</text><text x="${X.root}" y="${ry+16}" text-anchor="middle" font-size="9" font-weight="700" fill="#fde68a">TAWHEED</text></g>`;
  return`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Decision tree"><defs><radialGradient id="rootg"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0b3b3a"/></radialGradient></defs>${heads}${links.map(path).join("")}${root}${nodes.join("")}</svg>`;
}

function convHtml(t){
  const hits=[];const re=new RegExp(VAGUE.source,"gi");let m;while((m=re.exec(t)))hits.push(m[0]);
  const marked=esc(t).replace(new RegExp(VAGUE.source,"gi"),w=>`<mark class="vg">${w}</mark>`);
  const hasNum=/\d/.test(t),hasDate=/\b(by|on|before)\s+(\w+\s)?\d|\b(mon|tues|wednes|thurs|fri|satur|sun)day\b|\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d/i.test(t);
  const hasProof=/\b(send|sent|publish|post|sign|submit|record|call|deliver|upload|pay|write|finish|ship|launch)\b/i.test(t);
  const words=t.trim().split(/\s+/).length;
  const items=[[!hits.length,"No vague words",hits.length?`Vague: ${[...new Set(hits.map(h=>h.toLowerCase()))].join(", ")}`:""],[hasDate,"A specific date","Add: by which date?"],[hasNum,"A number you can count","Add: how many, how much?"],[hasProof,"A visible action someone could see","Use a verb you could film: send, publish, sign, call"],[words<=30,"Short enough to be one step","Split it into steps of 8 hours or less"]];
  const score=items.filter(i=>i[0]).length;
  return`<div class="conv-out">${marked}</div><div class="row" style="margin-top:8px">${tone(score+"/5 concrete",score>=4?"var(--good)":score>=2?"var(--warn)":"var(--bad)")}</div>
    <div class="checklist">${items.map(i=>`<div><span style="color:${i[0]?"var(--good)":"var(--bad)"};font-weight:800">${i[0]?"✓":"✕"}</span>${i[0]?i[1]:`<span><b>${i[1]}</b> <span class="muted">${esc(i[2])}</span></span>`}</div>`).join("")}</div>
    <button class="btn gold" style="margin-top:10px" data-act="convStep">${I.plus} Turn this into a measurable step</button>`;
}

      <div class="st" style="background:linear-gradient(135deg,#075985,var(--contrib))"><b>4 · Fruit · Contribution</b><small>Sadaqah, zakat, mentoring. What the tree gives back is the true measure of its health.</small></div></div>

      <li>The Quran 14:24-25, 61:2-3, 3:159, 9:105, 53:39, 65:3. Hadith: Tirmidhi 2517; Muslim 2664; Bukhari and Muslim on consistent deeds. <a href="https://quran.com/14/24-25" target="_blank" rel="noopener">Link</a></li></ol></section>
  </div>`;

/* ---------- modals ---------- */
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function modal(html){closeModal();const b=document.createElement("div");b.className="modal-back";b.id="modalBack";b.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  b.addEventListener("mousedown",e=>{if(e.target===b)closeModal()});document.body.appendChild(b);const f=b.querySelector("input,textarea,select");if(f)f.focus();return b}
function closeModal(){const m=$("#modalBack");if(m)m.remove();$("#tip").hidden=true}
function confirmBox(title,body,label,fn,danger){const m=modal(`<h2>${title}</h2><p class="muted">${body}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x="no">Cancel</button><button class="btn ${danger?"danger":"gold"}" data-x="yes">${label}</button></div>`);
  m.querySelector('[data-x="no"]').onclick=closeModal;m.querySelector('[data-x="yes"]').onclick=()=>{closeModal();fn()}}
const btns=(isNew,label)=>`<div class="row" style="justify-content:space-between;margin-top:6px">${isNew?"<span></span>":`<button type="button" class="btn danger" data-x="del">${I.trash} Delete</button>`}<div class="row"><button type="button" class="btn" data-x="cancel">Cancel</button><button class="btn primary" type="submit">${label}</button></div></div>`;
function wire(m,onSubmit,onDel){m.querySelector('[data-x="cancel"]').onclick=closeModal;const d=m.querySelector('[data-x="del"]');if(d&&onDel)d.onclick=onDel;m.querySelector("form").addEventListener("submit",e=>{e.preventDefault();onSubmit()})}
const val=id=>$("#"+id).value;

    case"delGoal":confirmBox("Delete this goal?","Its steps, effort logs and named fears are deleted too.","Delete goal",()=>delGoal(d.p,d.g),true);break;
    case"newStep":stepModal(d.p,d.g);break;
    case"editStep":{const g=findGoal(d.p,d.g);stepModal(d.p,d.g,g.steps.find(s=>s.id===d.s));break}
    case"delStep":delStep(d.p,d.g,d.s);break;
    case"decide":decideModal(d.p,d.g);break;
    case"newFear":fearModal(d.p,d.g);break;
    case"editFear":fearModal(d.p,d.g,d.f);break;
    case"openGoal":curP=d.p;location.hash="#plan-"+d.p;setTimeout(()=>{const t=document.getElementById("goal-"+d.g);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})},60);break;
    case"goPlan":location.hash="#plan-"+d.p;break;
    case"scatterSel":scatterSel=d.v;render();break;
    case"treeSel":treeSel=d.v;render();break;
    case"radarSel":radarSel=d.v;render();break;
    case"trend":trendMetric=d.v;render();break;
    case"trendP":trendOn[d.p]=trendOn[d.p]?0:1;render();break;
    case"adh":{const day=S.adherence[adhKey]||(S.adherence[adhKey]={items:{},fear:"",despite:""});day.items[d.k]=!day.items[d.k];delete day.sample;touch("meta");render();break}
    case"adhNav":adhKey=d.d==="0"?todayKey():addDays(adhKey,+d.d);if(adhKey>todayKey())adhKey=todayKey();render();break;
    case"adhDay":adhKey=d.k;render();break;
    case"sign":{const t=($("[data-cov]")||{}).value||"";if(t.trim().length<20){toast("Write your covenant first (a few sentences)");break}S.settings.covenant={text:t.trim(),signed:todayKey()};touch("meta");render();toast("Covenant signed. May Allah make it easy.");break}
    case"partnerDone":{S.settings.partner.last=todayKey();delete S.settings.partner.sample;const day=S.adherence[todayKey()]||(S.adherence[todayKey()]={items:{},fear:"",despite:""});day.items.shura=true;touch("meta");render();toast("Check-in recorded");break}
    case"copyStatement":try{await navigator.clipboard.writeText(statement());toast("Copied. Send it as written.")}catch(err){modal(`<h2>Your honest update</h2><p class="muted small">Copying is blocked here. Select the text and copy it.</p><textarea rows="6" readonly>${esc(statement())}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-act="closeModal">Close</button></div>`)}break;
    case"closeModal":closeModal();break;
    case"convert":convText=$("#convIn").value;$("#convOut").innerHTML=convText.trim()?convHtml(convText):"";break;
    case"convStep":convText=$("#convIn").value;convStepModal();break;
    case"range":repRange=+d.n;render();break;
    case"pdf":makePdf();break;
    case"askRemoveSample":confirmBox("Remove sample data?","This deletes the example goals, steps, effort logs and check-ins. Anything you added yourself stays.","Remove sample data",()=>{removeSample();render();toast("Sample data removed")});break;
    case"loadSample":seedSample();S.settings.sampleDismissed=false;touch();render();toast("Sample data loaded");break;
    case"askReset":confirmBox("Erase everything?","All goals, steps, effort logs, check-ins and settings will be deleted from this browser"+(dbApi?" and your account":"")+". This cannot be undone.","Erase everything",()=>{S.planners=emptyPlanners();S.adherence={};S.settings=Object.assign(defaultSettings(),{seeded:true,sampleDismissed:true});touch();applyTheme();render();toast("All data erased")},true);break;
    case"exportJson":deliver("shajarah-backup-"+todayKey()+".json",new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));break;
    case"exportCsv":{const C=calc(),rows=[["planner","goal","step","due","hours_planned","hours_logged","effort_pct","self_reported_pct","verified","evidence","proof_of_done"]];
      PK.forEach(p=>S.planners[p].goals.forEach(g=>g.steps.forEach(s=>{const st=C.s[s.id];rows.push([PL[p].name,g.title,s.title,s.due,s.hoursPlan,st.logged,Math.round(st.eff*100),s.selfPct,st.ver?"yes":"no",s.evidence,s.proof])})));
      rows.push([]);rows.push(["log_date","planner","step","hours","completion_pct","note"]);PK.forEach(p=>S.planners[p].logs.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(l=>{const f=findStep(l.stepId);rows.push([l.date,PL[p].name,f?f.s.title:"",l.hours,l.pct,l.note||""])}));
      deliver("shajarah-steps-and-effort.csv",new Blob([rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n")],{type:"text/csv"}));break}
    case"importJson":$("#importFile").click();break;
  }
});
document.addEventListener("input",e=>{const el=e.target;
  if(el.dataset.adh){const day=S.adherence[adhKey]||(S.adherence[adhKey]={items:{},fear:"",despite:""});day[el.dataset.adh]=el.value;delete day.sample;touch("meta")}
  else if(el.dataset.cov){S.settings.covenant.text=el.value;delete S.settings.covenant.sample;touch("meta")}
});
document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.kpi){const g=findGoal(el.dataset.p,el.dataset.kpi);if(g){g.kpiActual=+el.value||0;touch("planner-"+el.dataset.p);render();toast("Fruit updated")}return}
  const k=el.dataset.set;if(!k)return;const s=S.settings;let v=el.type==="checkbox"?el.checked:el.value;
  if(k.startsWith("weekly."))s.weekly[k.slice(7)]=Math.max(.5,+v||1);
  else if(k.startsWith("brand."))s.brand[k.slice(6)]=v;
  else if(k.startsWith("partner.")){s.partner[k.slice(8)]=v;delete s.partner.sample}
  else if(k==="proceedAt")s.proceedAt=clamp(+v||70,30,100);
  else s[k]=v;
  touch("meta");applyTheme();render();toast("Saved")});
$("#importFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.settings||!o.planners)throw 0;hydrate(o);touch();applyTheme();render();toast("Backup imported")}catch(err){toast("That file is not a Shajarah backup.")}};r.readAsText(f);e.target.value=""});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
/* tooltip */
const tip=$("#tip");
document.addEventListener("mousemove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(!el||$("#modalBack")){tip.hidden=true;return}
  tip.textContent=el.dataset.tip;tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+"px";tip.style.top=y+"px"});
document.addEventListener("scroll",()=>tip.hidden=true,true);
function applyTheme(){const t=S.settings.theme;if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}
function onRoute(){const h=location.hash.slice(1);
  if(h.startsWith("plan-")&&PL[h.slice(5)]){route="plan";curP=h.slice(5)}else route=TABS.some(t=>t[0]===h)?h:"dashboard";
  closeModal();render();window.scrollTo(0,0)}
window.addEventListener("hashchange",onRoute);

/* ---------- boot ---------- */
const had=loadLocal();
if(!had||(!S.settings.seeded&&!S.settings.sampleDismissed))seedSample();
applyTheme();onRoute();
setInterval(()=>{if(!$("#modalBack")&&!document.activeElement.matches("input,textarea,select"))render()},5*60000);
connectDb();
})();
</script>
</body></html>
